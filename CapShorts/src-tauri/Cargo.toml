[package]
name = "opencaption"
version = "1.0.0"
description = "OpenCaption - Desktop AI Video Suite"
authors = ["OpenCaption Contributors"]
edition = "2021"

[lib]
name = "opencaption_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
