name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: CapShorts/src-tauri

      - name: Install frontend dependencies
        working-directory: CapShorts/frontend
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: CapShorts
          tagName: ${{ github.ref_name }}
          releaseName: 'CapShorts ${{ github.ref_name }}'
          releaseBody: |
            ## CapShorts ${{ github.ref_name }}

            ### 📥 Download
            Download the Windows installer (.exe / .msi) from the assets below.

            ### ⚡ What's New
            See the [commit log](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
          releaseDraft: false
          prerelease: false
